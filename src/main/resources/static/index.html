<!DOCTYPE html>
<html lang="en" class="editable">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bootstrap Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/downloadjs/1.4.8/download.min.js"></script>
  <style>
    .editable {
      position: relative;
    }

    /* div:empty, section:empty, form:empty, ul:empty, ol:empty, li:empty {
      min-height: 40px;
      border: 1px dashed #bbbbbb;
    } */

    .ce-toolbar__actions {
      position: absolute;
      display: none;
      z-index: 10001;
      /* Higher than selector */
      opacity: 0.95;
      background: white;
      border-radius: 4px;
      box-shadow: 0 3px 15px -3px rgba(13, 20, 33, 0.13);
      padding: 2px;
    }

    .ce-toolbar__plus,
    .ce-toolbar__settings-btn {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      color: #707684;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .ce-toolbar__plus {
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
    }

    .ce-toolbar__settings-btn {
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
    }

    .ce-toolbar__plus:hover,
    .ce-toolbar__settings-btn:hover {
      background: #EFEFEF;
      color: #1D202B;
    }

    /* Dropdown styles */
    .ce-toolbox {
      position: absolute;
      top: 100%;
      left: 0;
      background: white;
      border-radius: 6px;
      box-shadow: 0 3px 15px -3px rgba(13, 20, 33, 0.13);
      width: 200px;
      display: none;
      z-index: 1000;
    }

    .ce-toolbox.active {
      display: block;
    }

    .ce-toolbox__content {
      background: white;
      border-radius: 6px;
      box-shadow: 0 3px 15px -3px rgba(13, 20, 33, 0.13);
    }

    .ce-popover__item {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      cursor: pointer;
      color: #707684;
      transition: background 0.2s ease;
      position: relative;
    }

    .ce-popover__item[data-type="header"]::after {
      content: "›";
      position: absolute;
      right: 8px;
      font-size: 16px;
      line-height: 1;
    }

    .ce-popover__item[data-type="container"]::after {
      content: "›";
      position: absolute;
      right: 8px;
      font-size: 16px;
      line-height: 1;
    }

    .ce-popover__item:hover {
      background: #EFEFEF;
      color: #1D202B;
    }

    .ce-popover__item:hover>.ce-popover__submenu {
      display: block;
    }

    .ce-popover__submenu {
      display: none;
      position: absolute;
      left: 100%;
      top: 0;
      background: white;
      border-radius: 6px;
      box-shadow: 0 3px 15px -3px rgba(13, 20, 33, 0.13);
      min-width: 100px;
      z-index: 1001;
    }

    .ce-popover__submenu-item {
      padding: 8px 16px;
      cursor: pointer;
      color: #707684;
      transition: background 0.2s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ce-popover__submenu-item-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      font-weight: 600;
      font-size: 14px;
    }

    .ce-popover__submenu-item:hover {
      background: #EFEFEF;
      color: #1D202B;
    }

    .ce-popover__item-icon {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      display: flex;
      align-items: center;
    }

    .ce-popover__item-label {
      font-size: 14px;
      line-height: 20px;
    }

    .ce-settings-menu {
      position: absolute;
      top: 100%;
      left: 36px;
      background: white;
      border-radius: 6px;
      box-shadow: 0 3px 15px -3px rgba(13, 20, 33, 0.13);
      width: 150px;
      display: none;
      z-index: 1000;
    }

    .ce-settings-menu.active {
      display: block;
    }

    /* Component selector styles */
    .component-selector {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 4px;
      padding: 4px 8px;
      z-index: 1001;
      font-size: 13px;
      pointer-events: auto;
      align-items: center;
      height: 300px;
      overflow: auto;
    }

    .selector-item {
      display: flex;
      align-items: center;
      padding: 2px 6px;
      cursor: pointer;
      color: #1D202B;
      transition: all 0.2s ease;
      border-radius: 3px;
      pointer-events: all;
      white-space: nowrap;
      line-height: 1;
      user-select: none;
    }

    .selector-item.dragging {
      opacity: 0.5;
      background: #f5f5f5;
    }

    .selector-item.drag-over {
      border-bottom: 2px solid #0066cc;
    }

    .selector-item.drag-over-top {
      border-top: 2px solid #0066cc;
    }

    .selector-tree-item {
      display: none;
    }

    .selector-tree-item.expanded {
      display: block;
    }

    .selector-item.child {
      padding-left: 20px;
    }

    .selector-item.selected-child {
      padding-left: 20px;
      font-weight: bold;
      color: #1D202B;
      background: #F8F9FA;
    }

    .selector-item.selected-parent {
      color: #1D202B;
    }

    .selector-item.selected-path {
      color: #1D202B;
    }

    .selector-item-prefix {
      opacity: 0.7;
      margin-right: 4px;
      display: inline-block;
      width: 12px;
      text-align: center;
      font-size: 20px;
    }

    .selector-item:hover {
      background: #EFEFEF;
      color: #1D202B;
    }

    .selector-item.selected {
      font-weight: bold;
      color: #1D202B;
      background: #F8F9FA;
    }

    .selector-separator {
      color: #707684;
      margin: 0 2px;
      padding: 2px 6px;
      user-select: none;
      pointer-events: none;
      opacity: 0.5;
    }

    /* Ensure toolbar and selector stay visible when interacting */
    .ce-toolbar__actions:hover {
      display: flex !important;
    }

    .container,
    .container-fluid,
    .container-sm,
    .container-md,
    .container-lg,
    .container-xl,
    .container-xxl {
      min-height: 40px;
    }

    .figure {
      margin: 1rem 0;
    }

    [contenteditable="true"] {
      outline: none;
    }

    [contenteditable="true"]:focus {
      outline: none;
    }

    body {
      margin: 0px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      position: relative;
    }

    .styles-dialog {
      background: white;
      overflow-y: auto;
      max-height: calc(100vh - 400px); /* Use max-height instead of height */
      position: relative;
      margin-top: 20px;
      margin-bottom: 20px; /* Add margin at bottom */
    }

    .styles-dialog.active {
      display: block;
    }

    .styles-dialog-header {
      position: sticky;
      top: 0;
      background: white;
      z-index: 1;
    }

    .styles-dialog table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
    }

    .styles-dialog th,
    .styles-dialog td {
      padding: 6px 8px;
      text-align: left;
      border-bottom: 1px solid #eee;
      word-break: break-word;
    }

    .styles-dialog th:first-child,
    .styles-dialog td:first-child {
      width: 50%;
    }

    .styles-dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    .styles-dialog-title {
      font-weight: 600;
      color: #1D202B;
    }

    .styles-dialog-close {
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      color: #707684;
    }

    .styles-dialog-close:hover {
      background: #f8f9fa;
      color: #1D202B;
    }

    .styles-dialog-element {
      font-family: monospace;
      padding: 8px;
      margin: 8px 0;
      background: #f8f9fa;
      border-radius: 4px;
      color: #1D202B;
      word-break: break-all;
    }


    .highlight-margin {
      position: absolute;
      background: rgba(181, 252, 205, 0.7);
      pointer-events: none;
      z-index: 9997;
      transition: all 0.1s ease-in-out;
      min-height: unset !important;
    }

    .highlight-element {
      position: absolute;
      background: rgba(61, 144, 215, 0.5);
      pointer-events: none;
      z-index: 9999;
      transition: all 0.1s ease-in-out;
      border-style: solid;
      border-color: rgba(58, 89, 209, 0.6);
      /* border-color: rgba(122, 198, 210, 0.6); */
      min-height: unset !important;
    }

    .mini-selector {
      position: fixed;
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 4px;
      font-size: 13px;
      display: none;
      max-width: 300px;
      min-width: 150px;
      max-height: 400px;
      overflow: auto;
      z-index: 10000;
    }

    .mini-selector .selector-item {
      padding: 2px 4px;
      padding-left: 20px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
      height: 40px;
    }

    .mini-selector .selector-item::before {
      content: '';
      position: absolute;
      left: 8px;
      top: 50%;
      width: 8px;
      height: 1px;
      background: #333333;
    }

    .mini-selector .selector-item.parent {
      padding-left: 4px;
      border-bottom: 1px solid #eee;
      margin-bottom: 4px;
      padding-bottom: 4px;
      color: #666;
    }

    .mini-selector .selector-item.parent::before {
      display: none;
    }

    .mini-selector .siblings-group {
      border-bottom: 1px solid #eee;
      margin-bottom: 4px;
      padding-bottom: 4px;
    }

    .mini-selector .children-group {
      margin-left: 20px;
    }

    .mini-selector .children-group .selector-item {
      padding-left: 16px;
    }

    .mini-selector .children-group .selector-item::before {
      left: 4px;
    }

    .mini-selector .selector-item.child {
      color: #666;
    }

    .mini-selector .selector-item:hover {
      background: #f0f0f0;
    }

    .mini-selector .selector-item.selected-child {
      background: #e0e0e0;
    }
  </style>
</head>

<body>
  <nav class="navbar bg-dark navbar-expand-sm" data-bs-theme="dark">
    <div class="container-fluid px-4 px-lg-5">
      <a class="navbar-brand" href="#">My Blog Editor</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-lg-0">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              File
            </a>
            <ul class="dropdown-menu">
              <li><a id="new" class="dropdown-item" href="#">New</a></li>
              <li><a id="publish" class="dropdown-item" href="#">Publish</a></li>
              <li><a id="save" class="dropdown-item" href="#">Save</a></li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li><a id="properties" class="dropdown-item" href="#">Properties</a></li>
            </ul>
          </li>
        </ul>
        <form class="d-flex">
          <input class="form-control me-2" type="search" placeholder="Go" aria-label="Go">
          <button id="location" class="btn btn-outline-success">Go</button>
        </form>        
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <div class="col-sm p-0">
        <iframe id="editor-frame" allow="fullscreen *; keyboard-map *"></iframe>
      </div>
      <div class="col-sm-3 p-1 pt-0">
        <!-- Component selector element -->
        <div class="styles-dialog-header">
          <div class="styles-dialog-title">Elements</div>
          <div class="styles-dialog-close">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path stroke="currentColor" stroke-width="2" d="M6 6l12 12M6 18L18 6" />
            </svg>
          </div>
        </div>
        <div id="component-selector" class="component-selector">
          <div class="hierarchy-menu"></div>
        </div>
        <div class="mini-selector"></div>
        <!-- Styles dialog element -->
        <div class="styles-dialog">
          <div class="styles-dialog-header">
            <div class="styles-dialog-title">Computed Styles</div>
            <div class="styles-dialog-close">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path stroke="currentColor" stroke-width="2" d="M6 6l12 12M6 18L18 6" />
              </svg>
            </div>
          </div>
          <div class="styles-dialog-element"></div>
          <table>
            <thead>
              <tr>
                <th>Property</th>
                <th>Value</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Editor.js style toolbar template -->
  <template id="toolbar-template">
    <div class="ce-toolbar__actions">
      <div class="ce-toolbar__plus">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M12 7V12M12 17V12M17 12H12M12 12H7">
          </path>
        </svg>
        <!-- Dropdown menu -->
        <div class="ce-toolbox">
          <div class="ce-popover__item" data-type="navbar">
            <div class="ce-popover__item-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect x="4" y="4" width="16" height="16" stroke="currentColor" stroke-width="2" />
                <path stroke="currentColor" stroke-width="2" d="M8 8h8M8 12h8M8 16h8" />
              </svg>
            </div>
            <div class="ce-popover__item-label">Navbar</div>
          </div>
          <div class="ce-popover__item" data-type="jumbotron">
            <div class="ce-popover__item-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect x="4" y="4" width="16" height="16" stroke="currentColor" stroke-width="2" />
                <path stroke="currentColor" stroke-width="2" d="M8 8h8M8 12h8M8 16h8" />
              </svg>
            </div>
            <div class="ce-popover__item-label">Jumbotron</div>
          </div>
          <div class="ce-popover__item" data-type="section">
            <div class="ce-popover__item-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect x="4" y="4" width="16" height="16" stroke="currentColor" stroke-width="2" />
                <path stroke="currentColor" stroke-width="2" d="M8 8h8M8 12h8M8 16h8" />
              </svg>
            </div>
            <div class="ce-popover__item-label">Section</div>
          </div>
          <div class="ce-popover__item" data-type="header">
            <div class="ce-popover__item-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-width="2"
                  d="M4 7h4m4 0h4m4 0h-4m-4 0H8m4 0v10M4 12h2m12 0h2M4 17h2m12 0h2" />
              </svg>
            </div>
            <div class="ce-popover__item-label">Header</div>
            <div class="ce-popover__submenu">
              <div class="ce-popover__submenu-item" data-type="h1">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <text x="4" y="17" fill="currentColor" style="font: bold 14px sans-serif;">H1</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Heading 1</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="h2">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <text x="4" y="17" fill="currentColor" style="font: bold 14px sans-serif;">H2</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Heading 2</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="h3">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <text x="4" y="17" fill="currentColor" style="font: bold 14px sans-serif;">H3</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Heading 3</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="h4">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <text x="4" y="17" fill="currentColor" style="font: bold 14px sans-serif;">H4</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Heading 4</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="h5">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <text x="4" y="17" fill="currentColor" style="font: bold 14px sans-serif;">H5</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Heading 5</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="h6">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <text x="4" y="17" fill="currentColor" style="font: bold 14px sans-serif;">H6</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Heading 6</div>
              </div>
            </div>
          </div>
          <div class="ce-popover__item" data-type="container">
            <div class="ce-popover__item-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24">
                <rect width="14" height="14" x="5" y="5" stroke="currentColor" stroke-width="2" rx="4" />
              </svg>
            </div>
            <div class="ce-popover__item-label">Container</div>
            <div class="ce-popover__submenu">
              <div class="ce-popover__submenu-item" data-type="container">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="4" y="6" width="16" height="12" stroke="currentColor" stroke-width="2" />
                  </svg>
                </div>
                <div class="ce-popover__item-label">Default Container</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="container-fluid">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="6" width="20" height="12" stroke="currentColor" stroke-width="2" />
                  </svg>
                </div>
                <div class="ce-popover__item-label">Fluid Container</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="container-sm">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="6" y="6" width="12" height="12" stroke="currentColor" stroke-width="2" />
                    <text x="9" y="15" fill="currentColor" style="font: bold 8px sans-serif;">SM</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Small Container</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="container-md">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="5" y="6" width="14" height="12" stroke="currentColor" stroke-width="2" />
                    <text x="8" y="15" fill="currentColor" style="font: bold 8px sans-serif;">MD</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Medium Container</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="container-lg">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="4" y="6" width="16" height="12" stroke="currentColor" stroke-width="2" />
                    <text x="8" y="15" fill="currentColor" style="font: bold 8px sans-serif;">LG</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Large Container</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="container-xl">

  <!-- Monaco Editor -->
  <script>
    // Set the correct path for Monaco's worker scripts
    var require = {
      paths: {
        'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs'
      }
    };
    
    // Format editor content using Monaco's built-in formatter
    async function formatEditorContent(editor) {
      if (editor && typeof editor.getAction === 'function') {
        try {
          // Use Monaco's built-in format action
          const formatAction = editor.getAction('editor.action.formatDocument');
          if (formatAction) {
            await formatAction.run();
          }
        } catch (error) {
          console.warn('Could not format content:', error);
        }
      }
    }
    
    // Unified save editor changes function
    async function saveEditorChanges(element, editor, inHead, parentSelector) {
      if (!element || !editor) return;
      
      try {
        // Format the editor content first
        await formatEditorContent(editor);
        const editorValue = editor.getValue();
        
        // Preserve element attributes before updating
        const preservedAttributes = preserveElementAttributes(element);
        
        // Handle different element types
        if (element.tagName.toLowerCase() === 'style') {
          if (inHead) {
            // For head style elements, save content as is
            element.textContent = editorValue;
          } else {
            // For non-head style elements, wrap in :where() with parent selector
            if (parentSelector) {
              // Wrap the edited content in :where() selector
              let wrappedContent = `:where(${parentSelector}) {\n  ${editorValue.replace(/\n/g, '\n  ')}\n}`;
              element.textContent = wrappedContent;
            } else {
              // If no parent selector, just save the content as is
              element.textContent = editorValue;
            }
          }
        } else if (element.tagName.toLowerCase() === 'script') {
          // For script elements, save content as is
          element.textContent = editorValue;
        } else {
          // For HTML elements, parse and update the document
          try {
            const newHtmlContent = editorValue;
            // Parse the new HTML content and update the document
            const parser = new DOMParser();
            const newDoc = parser.parseFromString(newHtmlContent, 'text/html');
            
            // Update the html element's content
            const newHtmlElement = newDoc.documentElement;
            const currentHtmlElement = element;
            
            // Update attributes
            for (let i = currentHtmlElement.attributes.length - 1; i >= 0; i--) {
              currentHtmlElement.removeAttribute(currentHtmlElement.attributes[i].name);
            }
            for (let i = 0; i < newHtmlElement.attributes.length; i++) {
              const attr = newHtmlElement.attributes[i];
              currentHtmlElement.setAttribute(attr.name, attr.value);
            }
            
            // Update child nodes
            const oldHead = currentHtmlElement.querySelector('head');
            const oldBody = currentHtmlElement.querySelector('body');
            const newHead = newHtmlElement.querySelector('head');
            const newBody = newHtmlElement.querySelector('body');
            
            if (oldHead && newHead) {
              oldHead.innerHTML = newHead.innerHTML;
            }
            
            if (oldBody && newBody) {
              oldBody.innerHTML = newBody.innerHTML;
            }
            
            // Refresh the selector to reflect the changes
            refreshSelector(currentHtmlElement);
          } catch (e) {
            console.error('Error updating HTML:', e);
          }
        }
        
        // Restore element attributes after updating
        restoreElementAttributes(element, preservedAttributes);
        
        // Show success message
        alert('Changes saved successfully!');
      } catch (e) {
        console.error('Error saving changes:', e);
        alert('Error saving changes. Please check the console for details.');
      }
    }
    
    // Utility function to preserve element attributes
    function preserveElementAttributes(element) {
      const attributes = {};
      for (let i = 0; i < element.attributes.length; i++) {
        const attr = element.attributes[i];
        attributes[attr.name] = attr.value;
      }
      return attributes;
    }
    
    // Utility function to restore element attributes
    function restoreElementAttributes(element, attributes) {
      // Clear existing attributes
      while (element.attributes.length > 0) {
        element.removeAttribute(element.attributes[0].name);
      }
      
      // Restore preserved attributes
      for (const [name, value] of Object.entries(attributes)) {
        element.setAttribute(name, value);
      }
    }

  <script>
    const template = document.getElementById('toolbar-template');
    const toolbar = template.content.cloneNode(true);
    document.body.appendChild(toolbar);

    // Initialize component selector
    const componentSelector = document.getElementById('component-selector');
    const miniSelector = document.querySelector('.mini-selector');
    const hierarchyMenu = componentSelector.querySelector('.hierarchy-menu');

    // Get toolbar elements after they're added to the DOM
    const toolbarElement = document.querySelector('.ce-toolbar__actions');
    const plusButton = document.querySelector('.ce-toolbar__plus');
    const settingsButton = document.querySelector('.ce-toolbar__settings-btn');
    const toolbox = document.querySelector('.ce-toolbox');
    const settingsMenu = document.querySelector('.ce-settings-menu');

    // Track current hovered element and active container
    let currentHoveredElement = null;
    let activeContainer = null;
    let mouseX = 0;
    let mouseY = 0;

    function isInViewport(element) {
      const rect = element.getBoundingClientRect();
      return (
        rect.top >= 0 &&
        rect.left >= 0 &&
        rect.bottom <= (iframe.contentWindow.innerHeight || editorDocument.documentElement.clientHeight) &&
        rect.right <= (iframe.contentWindow.innerWidth || editorDocument.documentElement.clientWidth)
      );
    }

    function getElementDescription(element) {
      if (element.id) {
        return `${element.tagName.toLowerCase()}#${element.id}`;
      } else if (element.className) {
        return `${element.tagName.toLowerCase()}.${element.className.split(' ')[0]}`;
      }
      return element.tagName.toLowerCase();
    }

    // Add click handlers for container submenu items
    const containerSubmenuItems = document.querySelectorAll('.ce-popover__submenu-item[data-type^="container"]');
    containerSubmenuItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        const type = item.getAttribute('data-type');
        createContainer(type);
      });
    });

    // Add row creation functionality
    const rowOption = document.querySelector('[data-type="row"]');
    rowOption.addEventListener('click', () => {
      if (activeContainer && (activeContainer.classList.contains('container') || activeContainer.tagName === 'section')) {
        // Create row
        const row = document.createElement('div');
        row.className = 'row editable';

        // Add row to active container
        activeContainer.appendChild(row);
        refreshSelector(row);
        showMiniSelector(activeContainer, mouseX, mouseY, 1);

        // Close the toolbox
        toolbox.classList.remove('active');
      }
    });

    // Add column creation functionality
    const colOption = document.querySelector('[data-type="col"]');
    colOption.addEventListener('click', () => {
      if (activeContainer && activeContainer.classList.contains('row')) {
        // Create column
        const col = document.createElement('div');
        col.className = 'col editable';

        // Add column to active row
        activeContainer.appendChild(col);
        refreshSelector(col);
        showMiniSelector(activeContainer, mouseX, mouseY, 1);

        // Close the toolbox
        toolbox.classList.remove('active');

    function focusSelect() {
      const range = document.createRange();
      range.selectNodeContents(this);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }

    // Function to add a new attribute row
    function addAttributeRow() {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td contenteditable="true" class="attr-name" placeholder="attribute">attribute</td>
        <td contenteditable="true" class="attr-value" placeholder="value">value</td>
      `;
      
      // Add event listeners to update attributes when changed
      const nameCell = row.querySelector('.attr-name');
      const valueCell = row.querySelector('.attr-value');
      
      nameCell.addEventListener('blur', updateAttribute);
      valueCell.addEventListener('blur', updateAttribute);
      
      nameCell.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          this.blur();
        }
      });
      
      valueCell.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          this.blur();
        } else if (e.key === 'Tab' && !(e.ctrlKey || e.altKey || e.shiftKey || e.metaKey)) {
          e.preventDefault();
          this.blur();
          setTimeout(() => {
            addAttributeRow();
          }, 100);
        }
      });
      
      nameCell.addEventListener('focus', function() {
        if (this.textContent === 'attribute') {
          this.textContent = '';
        }
      });
      
      valueCell.addEventListener('focus', function() {
        if (this.textContent === 'value') {
          this.textContent = '';
        }
      });

      // Insert after the attributes header row
      const attributesHeaderRow = Array.from(stylesTable.querySelectorAll('tr')).find(row => {
        const firstCell = row.querySelector('td');
        return firstCell && firstCell.textContent.includes('Attributes');
      });
      if (attributesHeaderRow) {
        attributesHeaderRow.after(row);
      } else {
        // Fallback - insert at beginning of table body
        const firstRow = stylesTable.querySelector('tr');
        if (firstRow) {
          firstRow.before(row);
        } else {
          stylesTable.appendChild(row);
        }
      }
      
      // Focus the name cell
      nameCell.focus();
    }

    // Function to update an attribute when name or value changes
    function updateAttribute(e) {
      const row = e.target.closest('tr');
      const nameCell = row.querySelector('.attr-name');
      const valueCell = row.querySelector('.attr-value');
      const attrName = nameCell.textContent.trim();
      const attrValue = valueCell.textContent.trim();
      
      if (activeContainer) {
        // If the attribute name is empty, remove the attribute and the row
        if (!attrName || attrName === 'attribute') {
          // If both name and value are empty, remove the row
          if ((!attrValue || attrValue === 'value') && (nameCell.textContent.trim() === '' || nameCell.textContent.trim() === 'attribute')) {
            row.remove();
          } else {
            // If only name is empty but value exists, set the value to an empty string
            activeContainer.setAttribute(attrName, attrValue);
          }
          return;
        }
        
        // Store the old attribute name before it's changed
        const oldAttrName = nameCell.dataset.oldName || attrName;
        
        // If the attribute name has changed, remove the old attribute first
        if (oldAttrName && oldAttrName !== attrName && oldAttrName !== attrName) {

    function getStylesheetsRules(element) {
      const matchedRules = [];
      const allSheets = editorDocument.styleSheets;
      
      try {
        // Loop through all stylesheets
        for (let i = 0; i < allSheets.length; i++) {
          let cssRules;
          try {
            cssRules = allSheets[i].cssRules || allSheets[i].rules;
          } catch (e) {
            // Skip cross-origin stylesheets
            continue;
          }

          if (allSheets[i].href === 'http://editor.local:8888/website/assets/css/main.css') {
            console.log('main.css');
          }
          // Loop through all rules in the stylesheet
          for (let j = 0; j < cssRules.length; j++) {
            const rule = cssRules[j];
            try {
              // Check if the rule applies to our element
              if (rule.selectorText && element.matches(rule.selectorText)) {
                // Parse cssText to get styles
                const styles = [];
                const computedStyle = window.getComputedStyle(element);
                const cssRules = rule.cssText.split('{')[1].split('}')[0].split(';');
                
                cssRules.forEach(rule => {
                  const [property, value] = rule.split(':').map(s => s.trim());
                  if (property && value) {
                    styles.push({
                      property: property,
                      value: value,
                      computedValue: computedStyle.getPropertyValue(property)
                    });
                  }
                });
                
                matchedRules.push({
                  selector: rule.selectorText,
                  styles: styles,
                  source: allSheets[i].href || 'inline stylesheet'
                });
              }
            } catch (e) {
              // Skip rules that can't be processed
              continue;
            }
          }
        }
      } catch (e) {
        console.error('Error accessing stylesheets:', e);
      }
      
      return matchedRules;
    }

    function getCssSelector(element) {
      if (!element || !element.tagName) return '';
      
      let selector = element.tagName.toLowerCase();
      
      if (element.id) {
        selector += `#${element.id}`;
      } else if (element.className) {
        // Include all classes (not just the first one), escaping dots in class names
        const classes = element.className.trim().split(/\s+/).filter(c => c).join('.');
        if (classes) {
          selector += `.${classes}`;
        }
      }
      
      return selector;
    }

    function processStyleElementUpdate(activeContainer, editorValue, inHead, parentSelector) {
      // Extract content between style tags if the editor shows full tags
      const styleTagMatch = editorValue.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
      if (styleTagMatch) {
        // Content includes style tags, extract the CSS content
        let content = styleTagMatch[1].trim();
        
        if (inHead) {
          // For head style elements, save just the CSS content
          activeContainer.textContent = content;
        } else {
          // For non-head style elements, wrap in :where() with parent selector
          if (parentSelector) {
            // Wrap the edited content in :where() selector
            let wrappedContent = `:where(${parentSelector}) {
  ${content.replace(/\n/g, '\n  ')}
}`;
            activeContainer.textContent = wrappedContent;
          } else {
            // If no parent selector, just save the CSS content as is
            activeContainer.textContent = content;
          }
        }
      } else {
        // If editor doesn't show style tags, handle as before
        if (inHead) {
          // For head style elements, save content as is
          activeContainer.textContent = editorValue;
        } else {
          // For non-head style elements, wrap in :where() with parent selector
          if (parentSelector) {
            // Wrap the edited content in :where() selector
            let wrappedContent = `:where(${parentSelector}) {
  ${editorValue.replace(/\n/g, '\n  ')}
}`;
            activeContainer.textContent = wrappedContent;
          } else {
            // If no parent selector, just save the content as is
            activeContainer.textContent = editorValue;
          }
        }
      }
    }

      const computedStyle = window.getComputedStyle(element);
      const cssRules = element.attributes.style ? ("{" + element.attributes.style.value + "}").split('{')[1].split('}')[0].split(';') : [];
      
      cssRules.forEach(rule => {
        const [property, value] = rule.split(':').map(s => s.trim());
        if (property && value) {
          inlineStyles.push({
            property: property,
            value: value,

          });

      const declaredStyles = {};

    function showMiniSelector(element, mouseX, mouseY, detail, keepPosition = false) {
      const parent = element.parentElement;
      if (!parent) return;

      // Store current position if needed
      const currentLeft = keepPosition ? miniSelector.style.left : null;
      const currentTop = keepPosition ? miniSelector.style.top : null;

      miniSelector.innerHTML = '';

      // Add parent first
      const parentDiv = document.createElement('div');
      parentDiv.className = 'selector-item parent';
      parentDiv.textContent = getElementDisplayName(parent);
      parentDiv.el = parent;
      parentDiv.addEventListener('click', (e) => {
        e.stopPropagation();
        if (e.detail !== 2) {
          showMiniSelector(parent, e.clientX, e.clientY, e.detail, true);
        }
        refreshSelector(parent);
        if (!isInViewport(parent)) {
          // parent.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        setTimeout(() => {
          showHighlight(parent);
          activeContainer = parent;
          stylesTable.innerHTML = '';
          updateStylesDialog(parent);
        }, 100);
      });
      parentDiv.addEventListener('mouseover', () => showHighlight(parent));
      parentDiv.addEventListener('mouseout', hideHighlight);
      miniSelector.appendChild(parentDiv);

      // Add siblings group
      const siblingsGroup = document.createElement('div');
      siblingsGroup.className = 'siblings-group';
      
      // Add all siblings including the selected element
      Array.from(parent.children).forEach(child => {
        const div = document.createElement('div');
        div.className = 'selector-item';
        if (child === element) {
          div.classList.add('selected-child');
          div.textContent = getElementDisplayName(child);
          div.el = child;
          
          div.addEventListener('mouseover', () => showHighlight(child));
          div.addEventListener('mouseout', hideHighlight);
          
          // Only add children for the selected element
          if (child.children.length > 0) {
            const childrenGroup = document.createElement('div');
            childrenGroup.className = 'children-group';
            
            Array.from(child.children).forEach(grandchild => {
              const childDiv = document.createElement('div');
              childDiv.className = 'selector-item child';
              childDiv.textContent = getElementDisplayName(grandchild);
              childDiv.el = grandchild;
              
              childDiv.addEventListener('click', (e) => {
                e.stopPropagation();
                if (e.detail !== 2) {
                  showMiniSelector(grandchild, e.clientX, e.clientY, e.detail, true);
                }
                refreshSelector(grandchild);
                if (!isInViewport(grandchild)) {
                  // grandchild.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                
                setTimeout(() => {
                  showHighlight(grandchild);
                  activeContainer = grandchild;
                  stylesTable.innerHTML = '';
                  updateStylesDialog(grandchild);
                }, 100);
              });
              
              childDiv.addEventListener('mouseover', () => showHighlight(grandchild));
              childDiv.addEventListener('mouseout', hideHighlight);
              childrenGroup.appendChild(childDiv);
            });
            
            siblingsGroup.appendChild(div);
            siblingsGroup.appendChild(childrenGroup);
          } else {
            siblingsGroup.appendChild(div);
          }
        } else {
          div.textContent = getElementDisplayName(child);
          div.el = child;
          
          div.addEventListener('click', (e) => {
            e.stopPropagation();
            if (e.detail !== 2) {
              showMiniSelector(child, e.clientX, e.clientY, e.detail, true);
            }
            refreshSelector(child);
            if (!isInViewport(child)) {
              // child.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            setTimeout(() => {
              showHighlight(child);
              activeContainer = child;
              
              // Update styles dialog
              stylesTable.innerHTML = '';
              updateStylesDialog(child);
            }, 100);
          });
          
          div.addEventListener('mouseover', () => showHighlight(child));
          div.addEventListener('mouseout', hideHighlight);
          siblingsGroup.appendChild(div);
        }
      });
      
      miniSelector.appendChild(siblingsGroup);

      // Position mini selector
      miniSelector.style.position = 'fixed';
      if (keepPosition && currentLeft && currentTop) {
        miniSelector.style.left = currentLeft;
        miniSelector.style.top = currentTop;
      } else {
        // Calculate position ensuring menu stays in viewport
        miniSelector.style.left = Math.min(mouseX, window.innerWidth - miniSelector.offsetWidth) + 'px';
        const proposedTop = mouseY - miniSelector.offsetHeight - 10;
        miniSelector.style.top = Math.max(0, proposedTop) + 'px';
      }
      if (editorDocument.activeElement === element && element.classList.contains('editable')) {
        miniSelector.style.display = 'none';
        toolbarElement.style.display = 'none';
      } else {
        miniSelector.style.display = 'block';
        
        // Position toolbar next to selected item after mini-selector is visible
        requestAnimationFrame(() => {
          const selectedItem = miniSelector.querySelector('.selected-child');
          if (selectedItem) {
            const selectedRect = selectedItem.getBoundingClientRect();
            const miniSelectorRect = miniSelector.getBoundingClientRect();
            
            toolbarElement.style.position = 'fixed';
            toolbarElement.style.top = selectedRect.top + 'px';
            toolbarElement.style.left = (miniSelectorRect.right) + 'px';
            toolbarElement.style.display = 'flex';
          }
        });
      }
    }

    function buildHierarchyChain(element) {
      const chain = [];

      let current = element;
      while (current && current.tagName !== 'HTML' && current.tagName !== 'BODY') {
        chain.unshift(current);
        current = current.parentElement;
      }

      return chain;

        headTreeContainer.className = 'selector-tree-item'; // Default to not expanded

        Array.from(headElement.children).forEach(child => {
          const isInChain = chain.includes(child);
          const isSelected = child === element;

          const childTagName = child.tagName.toLowerCase();
          const childClasses = Array.from(child.classList)
            .filter(cls => cls !== 'editable')

          const childId = child.id ? `#${child.id}` : '';

          let childClassName = 'selector-item child';
          if (isSelected) childClassName += ' selected-child';

          const hasChildren = child.children.length > 0;

              const grandchildClasses = Array.from(grandchild.classList)

              const grandchildHasChildren = grandchild.children.length > 0;
              const grandchildPrefix = grandchildHasChildren ? '▸' : '•';
              
              const grandchildDivHtml = `<div class="${grandchildClassName}" data-element="${grandchildTagName}" style="padding-left: 60px" draggable="true">
                <span class="selector-item-prefix">${grandchildPrefix}</span>${grandchildTagName}${grandchildId}${grandchildClasses ? ` .${grandchildClasses}` : ''}

        else if (isInChain) className += ' selected-path';

        const hasChildren = el.children.length > 0;

          const childDiv = document.createElement('div');
          childDiv.innerHTML = childHtml;
          childDiv.firstChild.el = child;
          treeContainer.appendChild(childDiv.firstChild);

          // Recursively build children

          if (!isInViewport(selectorItem.el)) {
            // selectorItem.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          
          activeContainer = selectorItem.el;

          // Update styles dialog to show properties of the selected element
          const stylesTable = document.querySelector('.styles-dialog table tbody');
          if (stylesTable) {
            stylesTable.innerHTML = '';
            updateStylesDialog(selectorItem.el);
          }
          
          // Wait for scroll to complete before showing highlight (smooth scroll typically takes ~800ms)
          setTimeout(() => {
            showHighlight(selectorItem.el);
          }, 800);
        }
      });

      editorDocument.addEventListener('mousedown', (e) => {
        if (e.detail === 2) {
          const target = e.target;
          if (target.contentEditable !== 'true' && target.tagName !== 'BODY') {
            e.stopPropagation();
            e.preventDefault();
            setTimeout(() => {
              miniSelector.style.display = 'none';
              toolbarElement.style.display = 'none';
              makeElementEditable(target, e);
            }, 100);
          }
        } else if (e.detail === 1) {
          if (e.target.closest('.component-selector')) {
            return;
          }
          refreshSelector(e.target);
          e.stopPropagation();
        }
      });

      editorDocument.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();

        mouseX = e.clientX;
        mouseY = e.clientY;
        const clickedElement = e.target;
        refreshSelector(clickedElement);

        // Show mini selector above mouse
        if (e.detail !== 2) {
          showMiniSelector(clickedElement, e.clientX, e.clientY, e.detail);
        }

        // Clear existing styles and update dialog
        stylesTable.innerHTML = '';
        updateStylesDialog(clickedElement);
        activeContainer = clickedElement;

        return false;
      }, true);

      // Hide mini selector when clicking outside
      document.addEventListener('click', (e) => {
        if (!miniSelector.contains(e.target)) {
          miniSelector.style.display = 'none';
        }
      });

      // Close mini-selector and toolbar on Escape key
      editorDocument.addEventListener('keydown', (e) => {
        console.log('keydown', e);
        if (e.key === 'Escape') {
          setTimeout(() => {
            miniSelector.style.display = 'none';
            toolbarElement.style.display = 'none';
            hideHighlight();
            activeElement = undefined;
          }, 100);
        }
      });

      // Close mini-selector and toolbar on Escape key
      document.addEventListener('keydown', (e) => {
        console.log('keydown', e);
        if (e.key === 'Escape') {
          miniSelector.style.display = 'none';
          toolbarElement.style.display = 'none';
          hideHighlight();
          activeElement = undefined;
        }
      });

      // Add mouseover handler for component selector items
      componentSelector.addEventListener('mouseover', (e) => {
        const selectorItem = e.target.closest('.selector-item');
        if (selectorItem && selectorItem.el) {
          showHighlight(selectorItem.el);
        }
      });

      editorDocument.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();

        const clickedElement = e.target;
        refreshSelector(clickedElement);

        if (e.detail !== 2) {
          // Show mini selector above mouse
          showMiniSelector(clickedElement, e.clientX, e.clientY, e.detail);
        }

        activeContainer = clickedElement;

        return false;
      }, true);

      // Hide mini selector when clicking outside
      document.addEventListener('click', (e) => {
        if (!miniSelector.contains(e.target)) {
          miniSelector.style.display = 'none';
        }
      });

      // Add mouseover handler for component selector items
      componentSelector.addEventListener('mouseover', (e) => {
        const selectorItem = e.target.closest('.selector-item');
        if (selectorItem && selectorItem.el) {
          showHighlight(selectorItem.el);
        }
      });

      editorDocument.addEventListener('mouseover', (e) => {
        const target = e.target;
        // if (target === editorDocument.body || target === editorDocument.documentElement) {
        if (target === editorDocument.documentElement) {
          return;
        }
        showHighlight(target);
      });

      editorDocument.addEventListener('mouseout', (e) => {
        const target = e.target;
        // if (target === editorDocument.body || target === editorDocument.documentElement) {
        if (target === editorDocument.documentElement) {
          return;
        }
      });

      editorDocument.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();

        const element = e.target;
        refreshSelector(element);

        if (e.detail === 1) {
          console.log('show toolbar');
          // Show mini selector above mouse
          showMiniSelector(element, e.clientX, e.clientY, e.detail);

          activeContainer = element;
        } else if (e.detail === 2) {
          setTimeout(() => {
            miniSelector.style.display = 'none';
            toolbarElement.style.display = 'none';
            makeElementEditable(element, e);
          }, 100);
        }
        
        return false;
      }, true);

      // Hide mini selector when clicking outside
      document.addEventListener('click', (e) => {
        if (!miniSelector.contains(e.target)) {
          miniSelector.style.display = 'none';
        }
      });

      // Add drag and drop functionality to component selector
      let draggedItem = null;
      let draggedOverItem = null;

      componentSelector.addEventListener('dragstart', (e) => {
        if (!e.target.classList.contains('selector-item')) return;
        draggedItem = e.target;
        draggedItem.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      componentSelector.addEventListener('dragend', (e) => {
        if (!draggedItem) return;
        draggedItem.classList.remove('dragging');
        if (draggedOverItem) {
          draggedOverItem.classList.remove('drag-over');
          draggedOverItem.classList.remove('drag-over-top');
        }
        draggedItem = null;
        draggedOverItem = null;
      });

      componentSelector.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!draggedItem) return;

        const target = e.target.closest('.selector-item');
        if (!target || target === draggedItem) return;

        // Get the bounding rectangle of the target
        const rect = target.getBoundingClientRect();
        const midY = rect.top + (rect.height / 2);

        // Determine if we're in the top or bottom half
        const isTop = e.clientY < midY;

        // Remove previous drag-over classes
        if (draggedOverItem) {
          draggedOverItem.classList.remove('drag-over');
          draggedOverItem.classList.remove('drag-over-top');
        }

        // Add appropriate class based on position
        target.classList.add(isTop ? 'drag-over-top' : 'drag-over');
        draggedOverItem = target;
      });

      componentSelector.addEventListener('drop', (e) => {
        e.preventDefault();
        if (!draggedItem || !draggedOverItem) return;

        const draggedEl = draggedItem.el;
        const targetEl = draggedOverItem.el;

        if (!draggedEl || !targetEl || draggedEl === targetEl) return;

        // Determine if dropping above or below the target
        const rect = draggedOverItem.getBoundingClientRect();
        const isTop = e.clientY < (rect.top + (rect.height / 2));

        // Move the element in the DOM
        if (isTop) {
          targetEl.parentNode.insertBefore(draggedEl, targetEl);
        } else {
          targetEl.parentNode.insertBefore(draggedEl, targetEl.nextSibling);
        }

        // Clean up
        draggedOverItem.classList.remove('drag-over');
        draggedOverItem.classList.remove('drag-over-top');
        draggedItem.classList.remove('dragging');

        // Refresh the selector to show the new order
        refreshSelector(draggedEl);
      });
    });

    // Create highlight overlays
    highlightOverlay = {
      margin: {
        top: document.createElement('div'),
        right: document.createElement('div'),
        bottom: document.createElement('div'),
        left: document.createElement('div')
      },
      element: document.createElement('div')
    };

    // Set classes for each element
    highlightOverlay.margin.top.className = 'highlight-margin highlight-margin-top';
    highlightOverlay.margin.right.className = 'highlight-margin highlight-margin-right';
    highlightOverlay.margin.bottom.className = 'highlight-margin highlight-margin-bottom';
    highlightOverlay.margin.left.className = 'highlight-margin highlight-margin-left';
    highlightOverlay.element.className = 'highlight-element';

    // Add all elements to the document
    document.body.appendChild(highlightOverlay.margin.top);
    document.body.appendChild(highlightOverlay.margin.right);
    document.body.appendChild(highlightOverlay.margin.bottom);
    document.body.appendChild(highlightOverlay.margin.left);
    document.body.appendChild(highlightOverlay.element);

    // Function to show highlight overlay for an element
    function showHighlight(element) {
      const rect = element.getBoundingClientRect();
      const frameRect = iframe.getBoundingClientRect();
      const computedStyle = window.getComputedStyle(element);

      // Get margin values
      const marginTop = parseInt(computedStyle.marginTop);
      const marginRight = parseInt(computedStyle.marginRight);
      const marginBottom = parseInt(computedStyle.marginBottom);
      const marginLeft = parseInt(computedStyle.marginLeft);

      // Get padding values
      const paddingTop = parseInt(computedStyle.paddingTop);
      const paddingRight = parseInt(computedStyle.paddingRight);
      const paddingBottom = parseInt(computedStyle.paddingBottom);
      const paddingLeft = parseInt(computedStyle.paddingLeft);

      // Log the dimensions after getting the values
      console.log('Element Dimensions:', {
        element: element.tagName,
        rect: {
          top: rect.top,
          right: rect.right, 
          bottom: rect.bottom,
          left: rect.left,
          width: rect.width,
          height: rect.height
        },
        margins: {
          top: marginTop,
          right: marginRight,
          bottom: marginBottom,
          left: marginLeft
        },
        padding: {
          top: paddingTop,
          right: paddingRight,
          bottom: paddingBottom,
          left: paddingLeft
        }
      });

      // Position and size top margin if present
      if (marginTop > 0) {
        highlightOverlay.margin.top.style.left = `${frameRect.left + rect.left - marginLeft}px`;
        highlightOverlay.margin.top.style.top = `${frameRect.top + rect.top - marginTop}px`;
        highlightOverlay.margin.top.style.width = `${rect.width + marginLeft + marginRight}px`;
        highlightOverlay.margin.top.style.height = `${marginTop}px`;
        highlightOverlay.margin.top.style.display = 'block';
      } else {
        highlightOverlay.margin.top.style.display = 'none';
      }

      // Position and size bottom margin if present
      if (marginBottom > 0) {
        highlightOverlay.margin.bottom.style.left = `${frameRect.left + rect.left - marginLeft}px`;
        highlightOverlay.margin.bottom.style.top = `${frameRect.top + rect.top + rect.height}px`;
        highlightOverlay.margin.bottom.style.width = `${rect.width + marginLeft + marginRight}px`;
        highlightOverlay.margin.bottom.style.height = `${marginBottom}px`;
        highlightOverlay.margin.bottom.style.display = 'block';
      } else {
        highlightOverlay.margin.bottom.style.display = 'none';
      }

      // Position and size left margin if present
      if (marginLeft > 0) {
        highlightOverlay.margin.left.style.left = `${frameRect.left + rect.left - marginLeft}px`;
        highlightOverlay.margin.left.style.top = `${frameRect.top + rect.top}px`;
        highlightOverlay.margin.left.style.width = `${marginLeft}px`;
        highlightOverlay.margin.left.style.height = `${rect.height}px`;
        highlightOverlay.margin.left.style.display = 'block';
      } else {
        highlightOverlay.margin.left.style.display = 'none';
      }

      // Position and size right margin if present
      if (marginRight > 0) {
        highlightOverlay.margin.right.style.left = `${frameRect.left + rect.left + rect.width}px`;
        highlightOverlay.margin.right.style.top = `${frameRect.top + rect.top}px`;
        highlightOverlay.margin.right.style.width = `${marginRight}px`;
        highlightOverlay.margin.right.style.height = `${rect.height}px`;
        highlightOverlay.margin.right.style.display = 'block';
      } else {
        highlightOverlay.margin.right.style.display = 'none';
      }

      // Position and size element highlight with padding as borders
      highlightOverlay.element.style.left = `${frameRect.left + rect.left}px`;
      highlightOverlay.element.style.top = `${frameRect.top + rect.top}px`;
      highlightOverlay.element.style.width = `${rect.width}px`;
      highlightOverlay.element.style.height = `${rect.height}px`;
      highlightOverlay.element.style.borderTopWidth = `${paddingTop}px`;
      highlightOverlay.element.style.borderRightWidth = `${paddingRight}px`;
      highlightOverlay.element.style.borderBottomWidth = `${paddingBottom}px`;
      highlightOverlay.element.style.borderLeftWidth = `${paddingLeft}px`;
      highlightOverlay.element.style.display = 'block';
    }

    function getElementDisplayName(element) {
      let name = element.tagName.toLowerCase();
      if (element.id) {
        name += `#${element.id}`;
      } else if (element.className && typeof element.className === 'string') {
        name += `.${element.className.split(' ')[0]}`;
      }
      return name;
    }
  </script>

  <script>
    document.getElementById("location").addEventListener("click", function (ev) {
      ev.preventDefault();
      const url = document.querySelector("input[type=search]").value;
      console.log(url);
      document.cookie = "proxy=" + url + "; path=/;";
      iframe.src = "editor/" + "?url=" + url + "&t=" + new Date().getTime();
    });

    document.getElementById('save').addEventListener('click', () => {
      const iframe = document.getElementById('editor-frame');
      const editStyles = iframe.contentDocument.getElementById("edit-styles");
      editStyles.remove();
      const iframeContent = iframe.contentWindow.document.documentElement.outerHTML;
      download(iframeContent, 'index.html', 'text/html');
    });
  </script>
</body>
