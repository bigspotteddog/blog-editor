<!DOCTYPE html>
<html lang="en" class="editable">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bootstrap Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    .editable {
      position: relative;
    }

    .ce-toolbar__actions {
      position: absolute;
      display: none;
      z-index: 10001; /* Higher than selector */
      opacity: 0.8;
      background: white;
      border-radius: 8px;
      box-shadow: 0 3px 15px -3px rgba(13, 20, 33, 0.13);
      padding: 2px;
    }

    .ce-toolbar__plus,
    .ce-toolbar__settings-btn {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      color: #707684;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .ce-toolbar__plus {
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
    }
    
    .ce-toolbar__settings-btn {
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
    }

    .ce-toolbar__plus:hover,
    .ce-toolbar__settings-btn:hover {
      background: #EFEFEF;
      color: #1D202B;
    }

    /* Dropdown styles */
    .ce-toolbox {
      position: absolute;
      top: 100%;
      left: 0;
      background: white;
      border-radius: 6px;
      box-shadow: 0 3px 15px -3px rgba(13, 20, 33, 0.13);
      width: 200px;
      display: none;
      z-index: 1000;
    }

    .ce-toolbox.active {
      display: block;
    }

    .ce-toolbox__content {
      background: white;
      border-radius: 6px;
      box-shadow: 0 3px 15px -3px rgba(13, 20, 33, 0.13);
    }

    .ce-popover__item {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      cursor: pointer;
      color: #707684;
      transition: background 0.2s ease;
      position: relative;
    }

    .ce-popover__item[data-type="header"]::after {
      content: "›";
      position: absolute;
      right: 8px;
      font-size: 16px;
      line-height: 1;
    }

    .ce-popover__item[data-type="container"]::after {
      content: "›";
      position: absolute;
      right: 8px;
      font-size: 16px;
      line-height: 1;
    }

    .ce-popover__item:hover {
      background: #EFEFEF;
      color: #1D202B;
    }

    .ce-popover__item:hover > .ce-popover__submenu {
      display: block;
    }

    .ce-popover__submenu {
      display: none;
      position: absolute;
      left: 100%;
      top: 0;
      background: white;
      border-radius: 6px;
      box-shadow: 0 3px 15px -3px rgba(13, 20, 33, 0.13);
      min-width: 100px;
      z-index: 1001;
    }

    .ce-popover__submenu-item {
      padding: 8px 16px;
      cursor: pointer;
      color: #707684;
      transition: background 0.2s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ce-popover__submenu-item-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      font-weight: 600;
      font-size: 14px;
    }

    .ce-popover__submenu-item:hover {
      background: #EFEFEF;
      color: #1D202B;
    }

    .ce-popover__item-icon {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      display: flex;
      align-items: center;
    }

    .ce-popover__item-label {
      font-size: 14px;
      line-height: 20px;
    }

    .ce-settings-menu {
      position: absolute;
      top: 100%;
      left: 36px;
      background: white;
      border-radius: 6px;
      box-shadow: 0 3px 15px -3px rgba(13, 20, 33, 0.13);
      width: 150px;
      display: none;
      z-index: 1000;
    }

    .ce-settings-menu.active {
      display: block;
    }

    /* Component selector styles */
    .component-selector {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 4px;
      padding: 4px 8px;
      z-index: 1001;
      font-size: 13px;
      pointer-events: auto; 
      align-items: center;
      height: 300px;
      overflow: auto;
    }

    .selector-item {
      display: flex;
      align-items: center;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 4px;
      margin: 2px 0;
      transition: all 0.2s ease;
      user-select: none;
      line-height: 1;
    }

    .selector-item:hover {
      background: rgba(0, 102, 204, 0.1);
    }

    .selector-item.selected {
      background: rgba(0, 102, 204, 0.2);
    }

    .selector-item.dragging {
      opacity: 0.5;
      background: rgba(0, 102, 204, 0.1);
    }

    .selector-item.drag-over {
      border: 2px dashed #0066cc;
      background: rgba(0, 102, 204, 0.05);
    }

    .selector-item.drag-over-top {
      border-top: 2px solid #0066cc;
    }

    .selector-item.drag-over-bottom {
      border-bottom: 2px solid #0066cc;
    }

    .selector-tree-item {
      display: none;
    }

    .selector-tree-item.expanded {
      display: block;
    }

    .selector-item.child {
      padding-left: 20px;
    }

    .selector-item.selected-child {
      padding-left: 20px;
      font-weight: bold;
      color: #1D202B;
      background: #F8F9FA;
    }

    .selector-item.selected-parent {
      color: #1D202B;
    }

    .selector-item.selected-path {
      color: #1D202B;
    }

    .selector-item-prefix {
      opacity: 0.7;
      margin-right: 4px;
      display: inline-block;
      width: 12px;
      text-align: center;
      font-size: 20px;
    }

    .selector-item.selected {
      font-weight: bold;
      color: #1D202B;
      background: #F8F9FA;
    }

    .selector-separator {
      color: #707684;
      margin: 0 2px;
      padding: 2px 6px;
      user-select: none;
      pointer-events: none;
      opacity: 0.5;
    }

    /* Ensure toolbar and selector stay visible when interacting */
    .ce-toolbar__actions:hover {
      display: flex !important;
    }

    .container, .container-fluid, .container-sm, .container-md, .container-lg, .container-xl, .container-xxl {
      min-height: 40px;
    }

    .figure {
      margin: 1rem 0;
    }

    [contenteditable="true"] {
      outline: none;
    }

    [contenteditable="true"]:focus {
      outline: none;
    }

    body {
      margin: 0px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    iframe.content-loaded {
      pointer-events: all;
    }

    #editor-styles {
      display: none;
    }

    .editor-drag-styles {
      content: "";
      display: none;
    }

    .editor-drag-styles .dragging {
      opacity: 0.5;
      outline: 2px solid #0066cc !important;
    }

    .editor-drag-styles .drag-target {
      outline: 2px dashed #0066cc !important;
      background: rgba(0, 102, 204, 0.05) !important;
    }

    .editor-drag-styles .drag-over-top {
      border-top: 2px solid #0066cc !important;
      margin-top: -2px !important;
    }

    .editor-drag-styles .drag-over-bottom {
      border-bottom: 2px solid #0066cc !important;
      margin-bottom: -2px !important;
    }

    .styles-dialog {
      width: 400px;
      background: white;
      overflow-y: auto;
      height: 100vh;
      position: sticky;
    }

    .styles-dialog.active {
      display: block;
    }

    .styles-dialog-header {
      position: sticky;
      top: 0;
      background: white;
      z-index: 1;
    }

    .styles-dialog table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
    }

    .styles-dialog th,
    .styles-dialog td {
      padding: 6px 8px;
      text-align: left;
      border-bottom: 1px solid #eee;
      word-break: break-word;
    }

    .styles-dialog th:first-child,
    .styles-dialog td:first-child {
      width: 50%;
    }

    .styles-dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    .styles-dialog-title {
      font-weight: 600;
      color: #1D202B;
    }

    .styles-dialog-close {
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      color: #707684;
    }

    .styles-dialog-close:hover {
      background: #f8f9fa;
      color: #1D202B;
    }

    .styles-dialog-element {
      font-family: monospace;
      padding: 8px;
      margin: 8px 0;
      background: #f8f9fa;
      border-radius: 4px;
      color: #1D202B;
      word-break: break-all;
    }

    .component-highlight {
      position: fixed;
      border: 2px solid #0066cc;
      background: rgba(0, 102, 204, 0.1);
      pointer-events: none;
      z-index: 1000;
      transition: all 0.2s ease;
    }

    .drag-target {
      border: 2px dashed #0066cc !important;
      background: rgba(0, 102, 204, 0.05) !important;
    }

    .drag-over-top {
      border-top: 3px solid #0066cc !important;
      margin-top: -3px !important;
      position: relative;
    }

    .drag-over-top::before {
      content: '';
      position: absolute;
      top: -20px;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(to bottom, 
        rgba(0, 102, 204, 0.3),
        rgba(0, 102, 204, 0.1) 50%,
        transparent
      );
      pointer-events: none;
      border-radius: 4px;
    }

    /* Add a drop arrow indicator */
    .drag-over-top::after {
      content: '▼';
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      color: #0066cc;
      font-size: 16px;
      text-shadow: 0 0 3px white;
    }

    .drag-over-bottom {
      border-bottom: 3px solid #0066cc !important;
      margin-bottom: -3px !important;
      position: relative;
    }

    .drag-over-bottom::before {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(to top,
        rgba(0, 102, 204, 0.3),
        rgba(0, 102, 204, 0.1) 50%,
        transparent
      );
      pointer-events: none;
      border-radius: 4px;
    }

    /* Add a drop arrow indicator */
    .drag-over-bottom::after {
      content: '▼';
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      color: #0066cc;
      font-size: 16px;
      text-shadow: 0 0 3px white;
    }

    .dragging {
      opacity: 0.5;
      outline: 3px solid #0066cc;
    }

    .mini-selector {
      position: fixed;
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 4px;
      font-size: 13px;
      display: none;
      max-width: 300px;
      z-index: 1000;
    }
      
    .mini-selector .selector-item {
      padding: 2px 4px;
      padding-left: 20px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
    }

    .mini-selector .selector-item::before {
      content: '';
      position: absolute;
      left: 8px;
      top: 50%;
      width: 8px;
      height: 1px;
      background: #ccc;
    }
    
    .mini-selector .selector-item.parent {
      padding-left: 4px;
      border-bottom: 1px solid #eee;
      margin-bottom: 4px;
      padding-bottom: 4px;
      color: #666;
    }

    .mini-selector .selector-item.parent::before {
      display: none;
    }

    .mini-selector .siblings-group {
      border-bottom: 1px solid #eee;
      margin-bottom: 4px;
      padding-bottom: 4px;
    }

    .mini-selector .children-group .selector-item {
      padding-left: 36px;
    }

    .mini-selector .children-group .selector-item::before {
      left: 24px;
    }

    .mini-selector .selector-item.child {
      color: #666;
    }
      
    .mini-selector .selector-item:hover {
      background: #f0f0f0;
    }
      
    .mini-selector .selector-item.selected-child {
      background: #e0e0e0;
    }

    .drag-over-top {
      border-top: 3px solid #0066cc !important;
      margin-top: -3px !important;
      position: relative;
    }

    .drag-over-top::before {
      content: '';
      position: absolute;
      top: -20px;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(to bottom, 
        rgba(0, 102, 204, 0.3),
        rgba(0, 102, 204, 0.1) 50%,
        transparent
      );
      pointer-events: none;
      border-radius: 4px;
    }

    .drag-over-top::after {
      content: '▼';
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      color: #0066cc;
      font-size: 16px;
      text-shadow: 0 0 3px white;
    }

    .drag-over-bottom {
      border-bottom: 3px solid #0066cc !important;
      margin-bottom: -3px !important;
      position: relative;
    }

    .drag-over-bottom::after {
      content: '▼';
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      color: #0066cc;
      font-size: 16px;
      text-shadow: 0 0 3px white;
    }

    .drag-target {
      outline: 3px dashed #0066cc !important;
      background: rgba(0, 102, 204, 0.1) !important;
      position: relative;
    }

    /* Add a "drop here" indicator */
    .drag-target::after {
      content: '⊕';
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      color: #0066cc;
      font-size: 16px;
      text-shadow: 0 0 3px white;
    }
  </style>
</head>

<body>
  <div class="container-fluid p-0">
    <div class="row">
      <div class="col-sm-9 p-0">
        <iframe id="editor-frame" src="/editor/blog/"></iframe>        
      </div>
      <div class="col-sm-3 p-2">
        <!-- Component selector element -->
        <div class="styles-dialog-header">
          <div class="styles-dialog-title">Elements</div>
          <div class="styles-dialog-close">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path stroke="currentColor" stroke-width="2" d="M6 6l12 12M6 18L18 6"/>
            </svg>
          </div>
        </div>
      <div id="component-selector" class="component-selector">
          <div class="hierarchy-menu"></div>
        </div>
        <div class="mini-selector"></div>
        <!-- Styles dialog element -->
        <div class="styles-dialog">
          <div class="styles-dialog-header">
            <div class="styles-dialog-title">Computed Styles</div>
            <div class="styles-dialog-close">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path stroke="currentColor" stroke-width="2" d="M6 6l12 12M6 18L18 6"/>
              </svg>
            </div>
          </div>
          <div class="styles-dialog-element"></div>
          <table>
            <thead>
              <tr>
                <th>Property</th>
                <th>Value</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>              
      </div>
    </div>
  </div>

  <!-- Editor.js style toolbar template -->
  <template id="toolbar-template">
    <div class="ce-toolbar__actions">
      <div class="ce-toolbar__plus">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M12 7V12M12 17V12M17 12H12M12 12H7">
          </path>
        </svg>
        <!-- Dropdown menu -->
        <div class="ce-toolbox">
          <div class="ce-popover__item" data-type="header">
            <div class="ce-popover__item-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-width="2" d="M4 7h4m4 0h4m4 0h-4m-4 0H8m4 0v10M4 12h2m12 0h2M4 17h2m12 0h2"/>
              </svg>
            </div>
            <div class="ce-popover__item-label">Header</div>
            <div class="ce-popover__submenu">
              <div class="ce-popover__submenu-item" data-type="h1">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <text x="4" y="17" fill="currentColor" style="font: bold 14px sans-serif;">H1</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Heading 1</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="h2">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <text x="4" y="17" fill="currentColor" style="font: bold 14px sans-serif;">H2</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Heading 2</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="h3">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <text x="4" y="17" fill="currentColor" style="font: bold 14px sans-serif;">H3</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Heading 3</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="h4">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <text x="4" y="17" fill="currentColor" style="font: bold 14px sans-serif;">H4</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Heading 4</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="h5">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <text x="4" y="17" fill="currentColor" style="font: bold 14px sans-serif;">H5</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Heading 5</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="h6">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <text x="4" y="17" fill="currentColor" style="font: bold 14px sans-serif;">H6</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Heading 6</div>
              </div>
            </div>
          </div>
          <div class="ce-popover__item" data-type="container">
            <div class="ce-popover__item-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24">
                <rect width="14" height="14" x="5" y="5" stroke="currentColor" stroke-width="2" rx="4"/>
              </svg>
            </div>
            <div class="ce-popover__item-label">Container</div>
            <div class="ce-popover__submenu">
              <div class="ce-popover__submenu-item" data-type="container">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="4" y="6" width="16" height="12" stroke="currentColor" stroke-width="2"/>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Default Container</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="container-fluid">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="6" width="20" height="12" stroke="currentColor" stroke-width="2"/>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Fluid Container</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="container-sm">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="6" y="6" width="12" height="12" stroke="currentColor" stroke-width="2"/>
                    <text x="9" y="15" fill="currentColor" style="font: bold 8px sans-serif;">SM</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Small Container</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="container-md">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="5" y="6" width="14" height="12" stroke="currentColor" stroke-width="2"/>
                    <text x="8" y="15" fill="currentColor" style="font: bold 8px sans-serif;">MD</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Medium Container</div>
              </div>
              <div class="ce-popover__submenu-item" data-type="container-lg">
                <div class="ce-popover__submenu-item-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="4" y="6" width="16" height="12" stroke="currentColor" stroke-width="2"/>
                    <text x="8" y="15" fill="currentColor" style="font: bold 8px sans-serif;">LG</text>
                  </svg>
                </div>
                <div class="ce-popover__item-label">Large Container</div>

  <!-- Toolbar initialization script -->

    const template = document.getElementById('toolbar-template');

    // Function to position toolbar for an element
    function positionToolbarForElement(element) {

      const rect = element.getBoundingClientRect();
      toolbarElement.style.position = 'absolute';
      toolbarElement.style.top = Math.max(0, rect.top + 30) + 'px';
      toolbarElement.style.left = Math.max(0, rect.left - 30) + 'px';

      settingsMenu.classList.remove('active');
      toolbox.classList.remove('active');

      toolbarElement.style.display = 'flex';
    }

    function getElementDescription(element) {
      if (element.id) {
        return `${element.tagName.toLowerCase()}#${element.id}`;
      } else if (element.className) {
        return `${element.tagName.toLowerCase()}.${element.className.split(' ')[0]}`;
      }
      return element.tagName.toLowerCase();
    }

    function positionSelectorOverElement(element, selector) {
      // const rect = element.getBoundingClientRect();
      
      // const left = rect.left + window.scrollX;
      // const top = rect.top + window.scrollY;
      
      // selector.style.left = `${left}px`;
      // selector.style.top = `${top}px`;      
    }

    function positionToolbarAtMouse(e) {
      const mouseX = e.clientX;
      const mouseY = e.clientY;
      
      toolbarElement.style.position = 'fixed';
      toolbarElement.style.left = `${mouseX}px`;
      toolbarElement.style.top = `${mouseY}px`;
      
      const rect = toolbarElement.getBoundingClientRect();
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;
      
      if (rect.right > viewportWidth) {
        toolbarElement.style.left = `${mouseX - rect.width}px`;
      }

      if (rect.bottom > viewportHeight) {
        toolbarElement.style.top = `${mouseY - rect.height}px`;
      }
    }

    function positionSelectorAtMouse(e) {
      const mouseX = e.clientX;
      const mouseY = e.clientY;
      
      componentSelector.style.position = 'fixed';
      componentSelector.style.left = `${mouseX}px`;
      componentSelector.style.top = `${mouseY}px`;
      
      const rect = componentSelector.getBoundingClientRect();
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;
      
      if (rect.right > viewportWidth) {
        componentSelector.style.left = `${mouseX - rect.width}px`;
      }
      if (rect.bottom > viewportHeight) {
        componentSelector.style.top = `${mouseY - rect.height}px`;
      }
    }

    const buttonOption = document.querySelector('[data-type="button"]');

      if (activeContainer) {

    // Add form creation functionality
    const formOption = document.querySelector('[data-type="form"]');
    formOption.addEventListener('click', () => {
      if (activeContainer) {

        const form = document.createElement('form');

        toolbox.classList.remove('active');
      }

    // Function to hide highlight overlay
    function hideHighlight() {
      highlightOverlay.style.display = 'none';
    }

    function buildHierarchyChain(element) {
      const chain = [];
      
      let current = element;
      while (current && current.tagName !== 'HTML' && current.tagName !== 'BODY') {
        chain.unshift(current);
        current = current.parentElement;
      }
    
      return chain;
    }

    function refreshSelector(element) {
      componentSelector.innerHTML = "";
      const chain = buildHierarchyChain(element);
      
      // Add main first
      const main = editorDocument.body;
      const mainHtml = `<div class="selector-item${main === element ? ' selected' : ''}" data-element="div" draggable="true">body</div>`;
      const mainDiv = document.createElement('div');
      mainDiv.innerHTML = mainHtml;
      mainDiv.firstChild.el = main;
      componentSelector.appendChild(mainDiv.firstChild);
      
      // Function to create element HTML with proper indentation and prefix
      function createElementHtml(el, level, isInChain, isSelected) {
        const tagName = el.tagName.toLowerCase();
        const classes = Array.from(el.classList)
          .filter(cls => cls !== 'editable')
          .join(' ');
        const id = el.id ? `#${el.id}` : '';
        
        let className = 'selector-item';
        if (level > 0) className += ' child';
        if (isSelected) className += ' selected-child';
        else if (isInChain) className += ' selected-path';
        
        const hasChildren = el.children.length > 0;
        const prefix = hasChildren ? '▸' : '•';
        const padding = level * 20;
        
        return `<div class="${className}" data-element="${tagName}" style="padding-left: ${padding}px" draggable="true">
          <span class="selector-item-prefix">${prefix}</span>${tagName}${id}${classes ? ` .${classes}` : ''}
        </div>`;
      }
      
      // Function to recursively build tree
      function buildTree(parent, level, container) {
        const children = Array.from(parent.children);
        if (children.length === 0) return;
        
        const treeContainer = document.createElement('div');
        treeContainer.className = 'selector-tree-item';
        // Expand if parent is in the chain
        if (chain.includes(parent) || parent === editorDocument.body) {
          treeContainer.classList.add('expanded');
        }
        
        for (const child of children) {
          const isInChain = chain.includes(child);
          const isSelected = child === element;
          
          const childHtml = createElementHtml(child, level, isInChain, isSelected);
          const childDiv = document.createElement('div');
          childDiv.innerHTML = childHtml;
          childDiv.firstChild.el = child;
          treeContainer.appendChild(childDiv.firstChild);
          
          // Recursively build children
          buildTree(child, level + 1, treeContainer);
        }
        
        container.appendChild(treeContainer);
      }
      
      // Build the entire tree
      buildTree(editorDocument.body, 1, componentSelector);
      
      // Find and scroll to selected element
      requestAnimationFrame(() => {
        const selectedElement = componentSelector.querySelector('.selected-child');
        if (selectedElement) {
          selectedElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      });
    }

    // Add delete functionality
    const deleteOption = document.querySelector('[data-action="delete"]');
    deleteOption.addEventListener('click', () => {
      if (activeContainer) {
        activeContainer.remove();
        miniSelector.style.display = 'none';
        hideHighlight();
        refreshSelector(editorDocument.body);
        settingsMenu.classList.remove('active');
        toolbox.classList.remove('active');
        toolbarElement.style.display = 'none';
      }
    });

    function makeElementEditable(element, clickEvent = null) {
      if (element) {
        element.contentEditable = true;
        element.classList.add('editable');
        
        // Add blur handler to remove contentEditable
        const blurHandler = () => {
          element.contentEditable = false;
          element.removeEventListener('blur', blurHandler);
        };
        element.addEventListener('blur', blurHandler);
        
        element.focus();
        
        if (clickEvent) {
          // Place caret at click position
          const range = document.caretRangeFromPoint(clickEvent.clientX, clickEvent.clientY);
          if (range) {
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
          }
        } else {
          // Default to end of content if no click position
          const range = document.createRange();
          range.selectNodeContents(element);
          range.collapse(false);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
        }
      }
    }

    const editOption = document.querySelector('[data-action="edit"]');
    editOption.addEventListener('click', () => {
      if (activeContainer) {
        makeElementEditable(activeContainer);
        toolbarElement.style.display = 'none';
        settingsMenu.classList.remove('active');
      }
    });

    const pasteOptionSettings = document.querySelector('[data-action="paste"]');
    pasteOptionSettings.addEventListener('click', async () => {
      if (activeContainer) {
        try {
          const clipboardData = await navigator.clipboard.readText();
          activeContainer.innerHTML = clipboardData;
          
          // Close the toolbox
          toolbox.classList.remove('active');
          toolbarElement.style.display = 'none';
          settingsMenu.classList.remove('active');
        } catch (err) {
          console.error('Failed to read clipboard contents:', err);
        }
      }

        height: 40px;
        background: linear-gradient(to bottom, 
          rgba(0, 102, 204, 0.3),
          rgba(0, 102, 204, 0.1) 50%,
          transparent
        );
        pointer-events: none;
        border-radius: 4px;
      }

      /* Add a drop arrow indicator */
      .drag-over-top::after {
        content: '▼';
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(-50%);
        color: #0066cc;
        font-size: 16px;
        text-shadow: 0 0 3px white;
      }

      .drag-over-bottom {
        border-bottom: 3px solid #0066cc !important;
        margin-bottom: -3px !important;
        position: relative;
      }

      .drag-over-bottom::before {
        content: '';
        position: absolute;
        bottom: -20px;
        left: 0;
        right: 0;
        height: 40px;
        background: linear-gradient(to top,
          rgba(0, 102, 204, 0.3),
          rgba(0, 102, 204, 0.1) 50%,
          transparent
        );
        pointer-events: none;
        border-radius: 4px;
      }

      /* Add a drop arrow indicator */
      .drag-over-bottom::after {
        content: '▼';
        position: absolute;
        bottom: -20px;
        left: 50%;
        transform: translateX(-50%);
        color: #0066cc;
        font-size: 16px;
        text-shadow: 0 0 3px white;
      }
    `;

    const styleElement = editorDocument.createElement('style');
    styleElement.textContent = styleSheet;
    editorDocument.head.appendChild(styleElement);
  }

  iframe.addEventListener('load', () => {
    injectIframeStyles();
  });
</script>
